<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RCOE Data Literacy Self-Assessment — Team reflection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Public+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
<style>
:root{
  --royal:#0032A0;        /* PMS 286 C */
  --royal-deep:#001E63;
  --royal-tint:#E8EDF9;
  --ink:#1A2238;
  --ink-soft:#4A5271;
  --gold:#D29F13;         /* PMS 7555 C */
  --gold-soft:#CBA052;    /* PMS 7407 C */
  --gold-pale:#F6EBCB;
  --ivory:#FAF7EF;
  --paper:#FFFFFF;
  --line:#E4DCC9;
  --band-strength:#A87B0F;
  --band-ontrack:#0032A0;
  --band-developing:#5F76B8;
  --band-priority:#233260;
  --radius:14px;
  --shadow:0 1px 2px rgba(26,34,56,.06), 0 10px 30px -18px rgba(0,50,160,.25);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
}
body{
  font-family:"Public Sans",system-ui,sans-serif;
  background:var(--ivory);
  color:var(--ink);
  line-height:1.6;
  font-size:16px;
}
.serif{font-family:"Fraunces",Georgia,serif}
a{color:var(--royal)}

/* ---------- header ---------- */
header.site{
  background:var(--royal-deep);
  color:#fff;
  border-bottom:4px solid var(--gold);
}
.site-inner{
  max-width:920px;margin:0 auto;padding:14px 24px;
  display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;
}
.site-org{
  font-family:"Fraunces",serif;font-weight:600;font-size:1.02rem;letter-spacing:.01em;
}
.mode-badge{
  font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--royal-deep);background:var(--gold);
  padding:4px 12px;border-radius:999px;white-space:nowrap;
}

/* ---------- progress thread ---------- */
nav.thread{position:sticky;top:0;z-index:20;background:rgba(250,247,239,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.thread-inner{max-width:920px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:0}
.tstep{display:flex;align-items:center;flex:1;min-width:0}
.tstep:last-child{flex:0}
.tdot{
  width:26px;height:26px;border-radius:50%;flex:none;
  border:2px solid var(--line);background:var(--paper);color:var(--ink-soft);
  font-size:.66rem;font-weight:700;display:grid;place-items:center;cursor:default;
  transition:all .2s;
}
button.tdot{cursor:pointer}
.tdot.done{border-color:var(--gold);background:var(--gold-pale);color:var(--royal-deep)}
.tdot.now{border-color:var(--royal);background:var(--royal);color:#fff;box-shadow:0 0 0 4px var(--royal-tint)}
.tline{height:2px;flex:1;background:var(--line);margin:0 4px}
.tline.done{background:var(--gold)}
.tlabel{display:none}
@media(min-width:760px){
  .tdot{width:auto;height:auto;border-radius:999px;padding:4px 12px;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase}
}

/* ---------- layout ---------- */
main{max-width:920px;margin:0 auto;padding:34px 24px 90px}
.screen{animation:fadein .35s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.eyebrow{
  font-size:.72rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  color:var(--gold-soft);margin-bottom:8px;
}
h1.big{font-family:"Fraunces",serif;font-weight:560;font-size:clamp(1.9rem,4.6vw,2.9rem);line-height:1.12;color:var(--royal-deep);letter-spacing:-.01em}
h2.screen-title{font-family:"Fraunces",serif;font-weight:560;font-size:clamp(1.45rem,3vw,1.9rem);color:var(--royal-deep);line-height:1.2}
.lede{font-size:1.06rem;color:var(--ink-soft);max-width:62ch;margin-top:14px}

.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:24px 26px}

/* ---------- cover ---------- */
.cover-grid{display:grid;gap:18px;margin-top:30px}
.cover-note h3{font-family:"Fraunces",serif;font-size:1.05rem;color:var(--royal-deep);margin-bottom:6px}
.cover-note p{color:var(--ink-soft);font-size:.95rem}
.gold-rule{width:56px;height:3px;background:var(--gold);border-radius:2px;margin:26px 0 18px}
.level-pick{margin-top:8px;display:grid;gap:10px}
@media(min-width:700px){.level-pick{grid-template-columns:repeat(3,1fr)}}
.level-btn{
  text-align:left;font:inherit;background:var(--paper);border:1.5px solid var(--line);
  border-radius:12px;padding:14px 16px;cursor:pointer;transition:all .15s;color:var(--ink);
}
.level-btn:hover{border-color:var(--gold-soft)}
.level-btn[aria-pressed="true"]{border-color:var(--royal);background:var(--royal-tint);box-shadow:inset 0 0 0 1px var(--royal)}
.level-btn .lb-t{font-weight:700;font-size:.95rem;color:var(--royal-deep)}
.footer-legal{margin-top:34px;font-size:.78rem;color:var(--ink-soft);border-top:1px solid var(--line);padding-top:14px;max-width:70ch}

/* ---------- scale table ---------- */
table.scale{width:100%;border-collapse:collapse;font-size:.92rem}
table.scale th{
  text-align:left;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);
  padding:10px 12px;border-bottom:2px solid var(--gold);
}
table.scale td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}
table.scale tr:last-child td{border-bottom:none}
.rnum{font-family:"Fraunces",serif;font-weight:700;color:var(--royal);font-size:1.15rem}
.rstage{font-weight:700;color:var(--royal-deep);white-space:nowrap}

/* ---------- items ---------- */
.domain-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.answered-chip{font-size:.78rem;font-weight:700;color:var(--ink-soft);background:var(--paper);border:1px solid var(--line);padding:3px 10px;border-radius:999px}
.answered-chip.full{color:var(--royal-deep);background:var(--gold-pale);border-color:var(--gold-soft)}
.domain-sub{color:var(--ink-soft);font-size:.93rem;max-width:64ch;margin-bottom:22px}
details.scale-ref{margin-bottom:22px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
details.scale-ref>summary{cursor:pointer;padding:12px 16px;font-weight:700;font-size:.88rem;color:var(--royal);list-style:none}
details.scale-ref>summary::before{content:"+ ";color:var(--gold)}
details.scale-ref[open]>summary::before{content:"\2212 "}
details.scale-ref>div{padding:0 16px 14px}

.item{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:var(--radius);padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow)}
.item.rated{border-left-color:var(--royal)}
.item-head{display:flex;gap:12px;align-items:baseline}
.item-num{font-family:"Fraunces",serif;font-weight:700;color:var(--gold-soft);font-size:.95rem;flex:none}
.item h3{font-family:"Fraunces",serif;font-weight:600;font-size:1.12rem;color:var(--royal-deep)}
.measures{font-size:.88rem;color:var(--ink-soft);margin:6px 0 12px;max-width:68ch}
.statement{
  font-size:1rem;background:var(--royal-tint);border-radius:10px;padding:12px 16px;color:var(--ink);
  border-left:3px solid var(--royal);margin-bottom:16px;
}
.scale-row{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
@media(max-width:560px){.scale-row{grid-template-columns:repeat(3,1fr)}}
.rate{
  font:inherit;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;
  padding:8px 4px 7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;
  transition:all .12s;color:var(--ink);
}
.rate:hover{border-color:var(--gold-soft);background:var(--gold-pale)}
.rate .n{font-family:"Fraunces",serif;font-weight:700;font-size:1.2rem;line-height:1;color:var(--royal-deep)}
.rate .stage{font-size:.6rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-soft);text-align:center;line-height:1.25}
.rate[aria-pressed="true"]{background:var(--royal);border-color:var(--royal)}
.rate[aria-pressed="true"] .n,.rate[aria-pressed="true"] .stage{color:#fff}
.desc{margin-top:12px;font-size:.9rem;color:var(--royal-deep);background:var(--gold-pale);border-radius:8px;padding:9px 14px;display:none}
.desc.show{display:block}
.desc .desc-n{font-weight:800;margin-right:6px}

/* ---------- scenarios ---------- */
.scenario{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:24px 26px;margin-bottom:22px;box-shadow:var(--shadow)}
.scen-eyebrow{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.scen-eyebrow .l{font-size:.72rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-soft)}
.scen-eyebrow .r{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.situation{font-size:.97rem;color:var(--ink);margin-bottom:14px;max-width:72ch}
.scen-q{font-family:"Fraunces",serif;font-weight:600;font-size:1.08rem;color:var(--royal-deep);margin-bottom:14px}
.opts{display:grid;gap:10px}
.opt{
  display:flex;gap:12px;align-items:flex-start;text-align:left;font:inherit;
  background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:13px 15px;cursor:pointer;
  transition:all .15s;color:var(--ink);font-size:.93rem;line-height:1.55;
}
.opt:hover:not(:disabled){border-color:var(--royal);background:var(--royal-tint)}
.opt:disabled{cursor:default}
.opt .letter{
  flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);
  display:grid;place-items:center;font-weight:800;font-size:.8rem;color:var(--ink-soft);margin-top:1px;
}
.opt.chosen{border-color:var(--royal);background:var(--royal-tint)}
.opt.chosen .letter{background:var(--royal);border-color:var(--royal);color:#fff}
.opt.best{border-color:var(--gold);background:var(--gold-pale);box-shadow:inset 0 0 0 1px var(--gold)}
.opt.best .letter{background:var(--gold);border-color:var(--gold);color:var(--royal-deep)}
.opt.dim{opacity:.55}
.opt-tag{font-size:.64rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;border-radius:999px;padding:2px 9px;margin-left:auto;flex:none;align-self:flex-start}
.opt-tag.tag-best{background:var(--gold);color:var(--royal-deep)}
.opt-tag.tag-you{background:var(--royal);color:#fff}
.why{display:none;margin-top:16px;border-top:2px solid var(--gold);padding-top:14px}
.why.show{display:block}
.why h4{font-family:"Fraunces",serif;color:var(--royal-deep);font-size:1rem;margin-bottom:6px}
.why p{font-size:.92rem;color:var(--ink-soft);max-width:74ch}

/* ---------- results ---------- */
.ribbon{
  background:linear-gradient(120deg,var(--royal-deep) 0%,var(--royal) 78%);
  color:#fff;border-radius:var(--radius);padding:30px 30px 26px;box-shadow:var(--shadow);
  border-bottom:5px solid var(--gold);margin-bottom:26px;
}
.ribbon .eyebrow{color:var(--gold)}
.overall-row{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;margin-top:6px}
.overall-num{font-family:"Fraunces",serif;font-weight:650;font-size:3.4rem;line-height:1}
.band-chip{font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding:5px 14px;border-radius:999px;white-space:nowrap}
.chip-strength{background:var(--gold);color:var(--royal-deep)}
.chip-ontrack{background:#fff;color:var(--royal)}
.chip-developing{background:var(--band-developing);color:#fff}
.chip-priority{background:var(--gold-pale);color:var(--band-priority)}
.ribbon .meaning{color:rgba(255,255,255,.85);font-size:.95rem;margin-top:8px}

.dom-results{display:grid;gap:14px;margin-bottom:30px}
.dom-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:18px 22px;box-shadow:var(--shadow)}
.dom-card-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.dom-card h3{font-family:"Fraunces",serif;font-weight:600;font-size:1.05rem;color:var(--royal-deep)}
.dom-avg{font-family:"Fraunces",serif;font-weight:700;font-size:1.5rem;color:var(--royal-deep)}
.dom-card .chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dom-card .meaning{font-size:.88rem;color:var(--ink-soft);margin-top:6px}
.bar{height:8px;border-radius:999px;background:var(--ivory);border:1px solid var(--line);margin-top:12px;overflow:hidden}
.bar>span{display:block;height:100%;border-radius:999px}
.fill-strength{background:var(--gold)}
.fill-ontrack{background:var(--royal)}
.fill-developing{background:var(--band-developing)}
.fill-priority{background:var(--band-priority)}

.section-h{font-family:"Fraunces",serif;font-weight:600;font-size:1.3rem;color:var(--royal-deep);margin:34px 0 6px}
.section-sub{font-size:.9rem;color:var(--ink-soft);margin-bottom:16px;max-width:70ch}
table.bands{width:100%;border-collapse:collapse;font-size:.9rem;background:var(--paper)}
table.bands th{text-align:left;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);padding:10px 12px;border-bottom:2px solid var(--gold)}
table.bands td{padding:10px 12px;border-bottom:1px solid var(--line)}
table.bands tr:last-child td{border-bottom:none}

.fa-block{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden}
.fa-head{padding:18px 22px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.fa-head h3{font-family:"Fraunces",serif;font-weight:600;font-size:1.1rem;color:var(--royal-deep)}
.fa-body{padding:18px 22px 22px}
.fa-focus{background:var(--gold-pale);border-left:3px solid var(--gold);border-radius:10px;padding:12px 16px;margin-bottom:8px}
.fa-focus .fl{font-size:.66rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-soft);display:block;margin-bottom:3px}
.fa-focus p{font-size:.9rem;color:var(--ink)}
details.other-levels{margin:8px 0 16px}
details.other-levels>summary{cursor:pointer;font-size:.82rem;font-weight:700;color:var(--royal);list-style:none}
details.other-levels>summary::before{content:"+ ";color:var(--gold)}
details.other-levels[open]>summary::before{content:"\2212 "}
.fa-actions{display:grid;gap:0;counter-reset:act}
.fa-action{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.fa-action::before{
  counter-increment:act;content:counter(act);
  font-family:"Fraunces",serif;font-weight:700;color:var(--gold-soft);font-size:1.1rem;text-align:center;padding-top:1px;
}
.fa-action .at{font-weight:700;font-size:.95rem;color:var(--royal-deep)}
.fa-action .ad{font-size:.88rem;color:var(--ink-soft);margin-top:3px}
details.fa-collapsed{border:1px dashed var(--gold-soft);border-radius:var(--radius);background:transparent;margin-bottom:14px}
details.fa-collapsed>summary{cursor:pointer;padding:14px 20px;font-weight:700;font-size:.92rem;color:var(--royal);list-style:none}
details.fa-collapsed>summary::before{content:"+ ";color:var(--gold)}
details.fa-collapsed[open]>summary::before{content:"\2212 "}
details.fa-collapsed .fa-body{padding-top:4px}

.scen-recap{display:grid;gap:10px;margin-bottom:8px}
.recap-row{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:13px 16px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;font-size:.9rem}
.recap-row .rr-n{font-family:"Fraunces",serif;font-weight:700;color:var(--gold-soft)}
.recap-row .rr-d{font-weight:700;color:var(--royal-deep)}
.recap-match{margin-left:auto;font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;border-radius:999px;padding:3px 10px}
.recap-match.yes{background:var(--gold-pale);color:#7a5c07;border:1px solid var(--gold-soft)}
.recap-match.no{background:var(--royal-tint);color:var(--royal-deep);border:1px solid var(--royal)}

/* ---------- footer nav ---------- */
.navrow{display:flex;justify-content:space-between;gap:14px;margin-top:30px;align-items:center;flex-wrap:wrap}
.btn{
  font:inherit;font-weight:700;border-radius:999px;padding:12px 26px;cursor:pointer;transition:all .15s;
  border:1.5px solid transparent;font-size:.95rem;
}
.btn-primary{background:var(--royal);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--royal-deep)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink-soft)}
.btn-ghost:hover{border-color:var(--royal);color:var(--royal)}
.btn-gold{background:var(--gold);color:var(--royal-deep)}
.btn-gold:hover{background:var(--gold-soft)}
.nav-hint{font-size:.82rem;color:var(--ink-soft)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}


.site-logo{width:44px;height:auto;flex:none;background:#fff;border-radius:8px;padding:3px;display:block}
.site-brand{display:flex;align-items:center;gap:12px}
footer.site-foot{border-top:1px solid var(--line);background:var(--paper)}
.foot-inner{max-width:920px;margin:0 auto;padding:18px 24px;font-size:.82rem;color:var(--ink-soft)}
.foot-inner a{color:var(--royal);font-weight:600}
@media print{
  nav.thread,.navrow,.btn{display:none!important}
  body{background:#fff}
  .card,.item,.scenario,.dom-card,.fa-block{box-shadow:none}
  details{display:block}
  details>summary{display:none}
  details:not([open])>*:not(summary){display:block!important}
}
</style>
</head>
<body>

<script>
const D = {"mode": "team", "modeLabel": "Team reflection", "resultsLabel": "Team Level Data Reflection", "cover": {"org": "RCOE Data Literacy Collaborative", "title": "Data Literacy Self-Assessment", "tagline": "A reflective tool for the use of data across all levels of instructional leadership. Self-ratings are a starting point for reflection and growth, not a score to measure against.", "purpose_h": "Purpose", "formative_h": "Formative, not evaluative", "formative": "This tool is formative, not evaluative: it is a starting point for reflection and conversation, not a measurement, ranking, or personnel judgment. Ratings are a place to begin a discussion, not a score to defend.", "levels_h": "Levels of focus", "levels": "The instrument is completed at one of three levels of focus — classroom-level, school site-level, or LEA-level data. “LEA-level” covers both districts and charter networks.", "copyright": "© Riverside County Office of Education. All rights reserved. Not for use or distribution without permission. For questions, contact ecarvajal@rcoe.us. Built on established research in data literacy and educational leadership; full citations available on request."}, "purpose": "This self-assessment lays out every item on a 1–6 developmental scale of practice, then four reasoning scenarios. There are 22 items across four domains. Your results appear after you complete the reflection.", "stages": ["Preimplementation", "Emerging Awareness", "Guided Practice", "Independent Practice", "Developing Others", "System Building"], "scale": ["This is not yet part of our regular practice.", "We recognize the value of this practice and are beginning to apply it intentionally.", "We apply this practice with guidance, support, or established structures.", "We consistently and independently apply this practice as part of our regular work.", "We model this practice, strengthen one another's use of it, and build one another's capacity.", "We have established the structures, expectations, and culture that sustain this practice across our organization."], "bands": [{"min": 5.0, "range": "5.0 – 6.0", "band": "Strength", "meaning": "Maintain and share this practice", "key": "strength"}, {"min": 4.0, "range": "4.0 – 4.9", "band": "On track", "meaning": "Keep building", "key": "ontrack"}, {"min": 3.0, "range": "3.0 – 3.9", "band": "Developing", "meaning": "Targeted support recommended", "key": "developing"}, {"min": 1.0, "range": "1.0 – 2.9", "band": "Priority focus", "meaning": "See practices to strengthen this domain", "key": "priority"}], "domains": [{"id": "d1", "name": "Domain 1: Knowledge and skills", "items": [{"sub": "Understanding data types", "measures": "Recognizing the different kinds of data that inform decisions — academic and non-academic, quantitative and qualitative — such as achievement, attendance, behavior, and perception data.", "statement": "We draw on multiple data types, and we use a combination of sources."}, {"sub": "Understanding assessment types", "measures": "Knowing the common assessment types — screener, diagnostic, interim/benchmark, and state/summative — and the limits of the results", "statement": "We use each assessment type for the decisions it is intended to inform and avoid drawing conclusions it cannot support."}, {"sub": "Growth versus proficiency", "measures": "Recognizing that growth and proficiency measure different things about the same student.", "statement": "We use both growth and proficiency data because each provides different information about student learning."}, {"sub": "Data interpretation and analysis", "measures": "Making sense of what data shows by asking what else could explain a result — the changes, conditions, and context behind the numbers, not just the numbers themselves.", "statement": "When analyzing student data, we first consider the context surrounding the results—including but not limited to changes in instruction, sample size, assessment and learning conditions, and other student factors that may influence the findings—before interpreting the results and determining appropriate actions."}, {"sub": "Student group data", "measures": "Reviewing data disaggregated by student group by recognizing patterns, considering instructional and contextual factors, and resisting premature conclusions until the results are interpreted within their broader context.", "statement": "When we examine data by student group, we first consider the instructional, systemic, and contextual factors that may contribute to differences in outcomes before drawing conclusions."}, {"sub": "Reading data displays", "measures": "Reading and interpreting charts, graphs, tables, and reports and understanding what information is being communicated, how it is presented, and any important information that may be missing.", "statement": "We can read a chart or report and notice what it is highlighting, and what it might be leaving out."}]}, {"id": "d2", "name": "Domain 2: Data use practices", "items": [{"sub": "Regular, purposeful data use", "measures": "Using data regularly and purposefully through formal structures of collaborative inquiry.", "statement": "We review student data regularly with a clear instructional purpose, using formal structures of collaborative inquiry to examine evidence of student learning, inform instructional decisions, and continuously improve teaching and learning."}, {"sub": "Following the full inquiry cycle", "measures": "Following a structured inquiry cycle by clearly defining the problem, exploring possible explanations, testing assumptions with evidence, and selecting appropriate evidence-based actions before implementing solutions.", "statement": "We use structured collaborative inquiry to define problems, examine multiple explanations, identify evidence-based responses, and evaluate their impact before determining next steps."}, {"sub": "Using more than one data source", "measures": "Triangulating multiple sources, across more than one point in time, before making a decision at any level.", "statement": "We examine multiple sources of evidence—including assessment results, student work, attendance, observations, and other relevant data—across multiple points in time before making decisions."}, {"sub": "Turning data into action", "measures": "Turning data into action by implementing specific instructional responses that directly address the identified need.", "statement": "We make specific changes to instruction as a result of our inquiry cycle."}, {"sub": "Inclusive sensemaking", "measures": "Making sense of data by first examining instructional, systemic, and contextual factors rather than attributing outcomes to students or student groups.", "statement": "We examine our instruction, supports, and learning conditions rather than drawing conclusions about students or student groups."}]}, {"id": "d3", "name": "Domain 3: Beliefs and dispositions", "items": [{"sub": "Belief that data improves practice", "measures": "Holding data as a tool for continuous improvement across levels of the organization rather than for evaluation or compliance.", "statement": "We review data to improve our instructional practices because we value data use for continuous improvement."}, {"sub": "Confidence in interpreting data", "measures": "Having confidence in our ability to interpret and use data to make informed decisions while recognizing what the data does and does not tell us.", "statement": "We make decisions confidently using the available evidence while recognizing when additional data is needed to confirm or challenge our assumptions."}, {"sub": "Openness to disconfirming evidence", "measures": "Being willing to reconsider our initial assumptions when new evidence suggests a different explanation.", "statement": "When the data tells a different story than we expected, we reconsider our assumptions and adjust our response accordingly."}, {"sub": "Asset based orientation", "measures": "Interpreting data in ways that recognize strengths, opportunities, and potential alongside areas for growth.", "statement": "We interpret data by recognizing students' strengths and experiences while considering how instruction, supports, and opportunities influence outcomes."}, {"sub": "Sense of agency and ownership", "measures": "Viewing data as a tool we use to improve teaching and learning, believing our actions can make a difference, and taking ownership of the decisions that follow.", "statement": "We choose to use data beyond what is required because we value its role in improving teaching and learning."}, {"sub": "Framing of data for continuous improvement", "measures": "The intentional communication of data and its intended use to shape attitudes toward engaging with and using data.", "statement": "When we share data with students or colleagues, we frame it as an opportunity for collaborative inquiry rather than as a judgment of performance."}]}, {"id": "d4", "name": "Domain 4: Organizational conditions", "items": [{"sub": "Time to review data together", "measures": "Allocated time for teams to analyze data together.", "statement": "We have designated time to review data with colleagues."}, {"sub": "Quality of our data systems", "measures": "The extent to which data systems provide accurate, timely, accessible, and meaningful information that supports informed decision-making.", "statement": "Our data systems give us information that is accurate and actionable."}, {"sub": "Leadership support for data use", "measures": "Creating conditions where staff can examine data critically.", "statement": "Our leaders create conditions where we can examine data critically, especially when it's disconfirming."}, {"sub": "Professional learning on data", "measures": "Ongoing opportunities to build the knowledge, skills, and confidence needed to understand, interpret, communicate, and use data effectively.", "statement": "The Local Education Agency's professional learning builds our competence to understand, interpret, communicate, and use data to inform instruction."}, {"sub": "Collaborative structures", "measures": "The formal structures and routines that support collaborative inquiry, shared dialogue, collective decision-making, and commitment to agreed-upon actions.", "statement": "We have processes and practices that allow for collaborative conversations that lead to shared decisions and collective action based on data."}]}], "levels": [{"key": "classroom", "label": "Classroom-level data"}, {"key": "school", "label": "School site-level data"}, {"key": "lea", "label": "LEA-level data"}], "focusAction": {"d1": {"title": "Focus and action: Knowledge and skills", "focus": {"classroom": "Teachers closest to students need strong foundational data literacy — especially around data types, growth versus proficiency, and reading displays critically. These skills make day-to-day instructional decisions defensible.", "school": "Principals need solid foundational data literacy to coach teachers and interpret site-level reports with credibility. This domain is the floor on which all other data use practice rests.", "lea": "District/network leaders need fluency with metrics to evaluate program effectiveness across many sites. Sound data interpretation and cross-source triangulation are especially critical at this level."}, "actions": [{"a": "Review the RCOE Data Literacy Framework with your team", "d": "This framework gives your team shared language for what data literacy actually is. Grounding people in its constructs reduces the gap between accessing data and interpreting it well."}, {"a": "Run a data systems and terminology audit", "d": "Map the metrics your school, district, or network uses every day. Identify which ones your leaders fully understand and which create confusion. Confusion about what a metric measures is one of the most common sources of poor decisions."}, {"a": "Build a local glossary tied to the reports you actually use", "d": "A glossary grounded in your specific dashboards reduces misinterpretation at the point of use. Include what each metric does NOT measure, not just what it does."}, {"a": "Practice reading data displays critically before accepting their framing", "d": "Start each data meeting with: What is this display measuring? What is it hiding? What source is it drawing from? Over time this builds critical literacy instead of passive acceptance."}, {"a": "Cross-check quantitative findings against qualitative sources", "d": "Make it a standing rule that no significant conclusion comes from a single data source. Pair assessment data with student work, perception surveys, or observations."}]}, "d2": {"title": "Focus and action: Data use practices", "focus": {"classroom": "Teachers close to students need the strongest use-practice skills, especially around formative interpretation and turning findings into tomorrow's instruction. Inclusive sensemaking matters most here.", "school": "For principals, moving from data to instructional action is the most important practice competency. Principals who skip the inquiry cycle or rely on a single data source tend to produce reactive rather than reflective data cultures.", "lea": "District/network leaders need strong inquiry practices to evaluate whether site-level data use is real or performative, and to facilitate cross-site learning."}, "actions": [{"a": "Use a structured inquiry cycle every time you look at data", "d": "Name the specific problem, examine data from multiple sources, generate competing hypotheses before picking a response, and plan how you'll evaluate it. Skipping the hypothesis step defaults the team to confirming what they already believe."}, {"a": "Build a data calendar tied to the decisions you actually face", "d": "Map data meetings to the real decisions you have to make across the year. Data conversations disconnected from real decisions rarely produce action."}, {"a": "End every data review with specific actions, not general observations", "d": "Require teams to name at least two concrete instructional changes that follow from what they saw. The gap between analysis and action is the most documented failure point in the literature."}, {"a": "Bring student voice and qualitative data into every inquiry cycle", "d": "Add at least one qualitative source to every data conversation. Single-source reliance narrows the evidence base and hides root causes that qualitative sources reveal."}, {"a": "Ask the inclusive question before drawing conclusions from student group data", "d": "Before attributing a pattern to student characteristics, require teams to name at least two systemic or instructional explanations. Cross-check against student and family voice before finalizing any interpretation."}]}, "d3": {"title": "Focus and action: Beliefs and dispositions", "focus": {"classroom": "What teachers believe about data — especially around confidence, inclusion, and agency — directly shapes how they engage with it. Teachers who experience data as evaluation tend to disengage or perform compliance.", "school": "Principals set the tone for how data is experienced by staff. A principal who frames data as evaluation produces a compliance culture. A principal who frames it as shared inquiry produces a learning culture.", "lea": "District/network leaders whose beliefs about data are compliance-oriented tend to produce compliance-oriented cultures at every site. How district/network leaders frame expectations decides how principals frame data for teachers."}, "actions": [{"a": "Surface and examine what your team actually believes about data", "d": "Belief-practice misalignment is a common but underaddressed barrier. Practice won't change if the underlying beliefs stay unexamined. Use Park, Daly, and Guerra's work on data culture to facilitate the conversation."}, {"a": "Write team agreements that name inclusive commitments and growth orientation", "d": "A covenant that names how members will engage with data — including when findings are uncomfortable — builds the psychological safety that open data use requires."}, {"a": "Share examples where data led to a real win for students", "d": "Stories of data leading to actual change counter the fatalism that develops when data feels mostly like accountability."}, {"a": "Routinely name what data CAN'T tell you, alongside what it can", "d": "Build intellectual humility into every data conversation. Ask: What might this measure be missing? What does it not capture about these students? This reorients teams toward asset-based interpretation."}, {"a": "Be deliberate about how you frame data at the moment you introduce it", "d": "Practice introducing data as a shared puzzle rather than as evidence of failure. Low engagement is usually a signal about your framing, not indifference."}]}, "d4": {"title": "Focus and action: Organizational conditions", "focus": {"classroom": "For teachers, this domain surfaces structural barriers worth naming and advocating for. It also helps distinguish between personal practice limits and conditions that need leadership attention.", "school": "Principals are the primary architects of site-level conditions. Protected time, psychological safety, and collaborative structures depend most directly on principal decisions and modeling.", "lea": "District/network leaders carry the greatest responsibility for organizational conditions, because they control time, money, professional learning, and the expectations that shape every site's culture."}, "actions": [{"a": "Audit how time is currently used and protect collaborative inquiry time", "d": "Time is the most cited barrier to real data use. Look at where time is going and identify at least one recurring slot to convert into structured inquiry. The time must be long enough to allow cross-source review."}, {"a": "Ask the people who use your data systems what makes them hard to use", "d": "The people closest to the systems know what's broken. Use that input to push for changes — and check whether your systems support qualitative data alongside the quantitative."}, {"a": "Model psychological safety by naming data that challenges your own decisions", "d": "Leaders who openly acknowledge when data reveals gaps in their own choices create conditions for honest data use. Without that modeling, staff learn to present data that confirms current practice."}, {"a": "Tie professional development to real data decisions, not tool training", "d": "Design PD around the specific interpretation and decision-making challenges your leaders and teachers actually face. Include skill-building around qualitative methods and cross-source triangulation."}, {"a": "Build team structures that mix qualitative and quantitative sources", "d": "Set the expectation that both kinds of data appear in every inquiry cycle. Even a standing 90-minute monthly data team that pairs student work with assessment data produces stronger interpretation."}]}}, "faIntro": "When a domain average falls below 4.0, these are the practices to strengthen the domain. Role notes explain how the focus differs by audience."};
const STEPS = [
  {id:"cover", label:"Welcome"},
  {id:"scale", label:"The scale"},
  {id:"d1", label:"Domain 1"},
  {id:"d2", label:"Domain 2"},
  {id:"d3", label:"Domain 3"},
  {id:"d4", label:"Domain 4"},
  {id:"results", label:"Results"},
];
const state = { step:0, level:"classroom", ratings:{}, maxVisited:0 };

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function bandFor(avg){
  if(avg>=5) return D.bands[0];
  if(avg>=4) return D.bands[1];
  if(avg>=3) return D.bands[2];
  return D.bands[3];
}
function fmt(n){ const r=Math.round(n*100)/100; return (Number.isInteger(r)?r.toFixed(1):String(r)); }
function domainAvg(dom){
  const vals = dom.items.map((_,i)=>state.ratings[dom.id+"-"+i]).filter(v=>v!=null);
  if(vals.length!==dom.items.length) return null;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}
function domainAnswered(dom){ return dom.items.filter((_,i)=>state.ratings[dom.id+"-"+i]!=null).length; }
function allRated(){ return D.domains.every(d=>domainAnswered(d)===d.items.length); }
function stepComplete(i){
  const id = STEPS[i].id;
  if(id==="cover") return true;
  if(id==="scale") return true;
  if(id==="results") return false;
  const dom = D.domains.find(d=>d.id===id);
  return domainAnswered(dom)===dom.items.length;
}

function renderThread(){
  const t = document.getElementById("thread");
  t.innerHTML = STEPS.map((s,i)=>{
    const now = i===state.step;
    const done = stepComplete(i) && i<state.step;
    const reachable = i<=state.maxVisited;
    const cls = "tdot"+(now?" now":done?" done":"");
    const inner = window.matchMedia("(min-width:760px)").matches ? esc(s.label) : (i+1);
    const dot = reachable && !now
      ? '<button class="'+cls+'" data-goto="'+i+'" aria-label="'+esc(s.label)+'">'+inner+'</button>'
      : '<span class="'+cls+'" aria-current="'+(now?"step":"false")+'">'+inner+'</span>';
    const line = i<STEPS.length-1 ? '<span class="tline'+(i<state.step?" done":"")+'"></span>' : "";
    return '<span class="tstep">'+dot+line+'</span>';
  }).join("");
  t.querySelectorAll("[data-goto]").forEach(b=>b.addEventListener("click",()=>go(+b.dataset.goto)));
}

function go(i){
  if(STEPS[i].id==="results" && !allRated()) return;
  state.step = i;
  state.maxVisited = Math.max(state.maxVisited, i);
  render();
  window.scrollTo({top:0});
}

function navRow(opts){
  const back = opts.back!==false ? '<button class="btn btn-ghost" id="backBtn">Back</button>' : "<span></span>";
  const hint = opts.hint ? '<span class="nav-hint">'+esc(opts.hint)+'</span>' : "";
  const next = opts.nextLabel ? '<button class="btn '+(opts.gold?"btn-gold":"btn-primary")+'" id="nextBtn" '+(opts.disabled?"disabled":"")+'>'+esc(opts.nextLabel)+'</button>' : "";
  return '<div class="navrow">'+back+'<span style="flex:1"></span>'+hint+next+'</div>';
}
function wireNav(){
  const b=document.getElementById("backBtn"); if(b) b.addEventListener("click",()=>go(state.step-1));
  const n=document.getElementById("nextBtn"); if(n) n.addEventListener("click",()=>go(state.step+1));
}

/* ---------------- screens ---------------- */
function screenCover(){
  const c = D.cover;
  return '<section class="screen">'
    +'<p class="eyebrow">'+esc(c.org)+'</p>'
    +'<h1 class="big">'+esc(c.title)+'</h1>'
    +'<p class="lede">'+esc(c.tagline)+'</p>'
    +'<div class="gold-rule"></div>'
    +'<div class="cover-grid">'
      +'<div class="cover-note card pad"><h3>'+esc(c.purpose_h)+'</h3><p>'+esc(D.purpose)+'</p></div>'
      +'<div class="cover-note card pad"><h3>'+esc(c.formative_h)+'</h3><p>'+esc(c.formative)+'</p></div>'
    +'</div>'
    + navRow({back:false, nextLabel:"Begin the reflection"})
    +'<p class="footer-legal">'+esc(c.copyright)+'</p>'
  +'</section>';
}
function wireCover(){}

function scaleTable(){
  return '<table class="scale"><thead><tr><th>Rating</th><th>Stage</th><th>What it means</th></tr></thead><tbody>'
    + D.scale.map((txt,i)=>'<tr><td><span class="rnum">'+(i+1)+'</span></td><td><span class="rstage">'+esc(D.stages[i])+'</span></td><td>'+esc(txt)+'</td></tr>').join("")
    +'</tbody></table>';
}
function screenScale(){
  return '<section class="screen">'
    +'<p class="eyebrow">Before you begin</p>'
    +'<h2 class="screen-title">The 1\u20136 rating scale</h2>'
    +'<p class="lede" style="margin-bottom:22px">A developmental progression of practice. You will rate each of the 22 items on this scale.</p>'
    +'<div class="card pad">'+scaleTable()+'</div>'
    + navRow({nextLabel:"Continue to Domain 1"})
  +'</section>';
}

function screenDomain(dom, idx){
  const answered = domainAnswered(dom);
  const total = dom.items.length;
  const full = answered===total;
  const items = dom.items.map((it,i)=>{
    const key = dom.id+"-"+i;
    const val = state.ratings[key];
    return '<article class="item'+(val?" rated":"")+'">'
      +'<div class="item-head"><span class="item-num">'+(idx+1)+'.'+(i+1)+'</span><h3>'+esc(it.sub)+'</h3></div>'
      +'<p class="measures">'+esc(it.measures)+'</p>'
      +'<p class="statement">'+esc(it.statement)+'</p>'
      +'<div class="scale-row" role="radiogroup" aria-label="'+esc(it.sub)+'">'
      + D.stages.map((st,r)=>'<button class="rate" data-key="'+key+'" data-val="'+(r+1)+'" aria-pressed="'+(val===r+1)+'"><span class="n">'+(r+1)+'</span></button>').join("")
      +'</div>'
      +'<p class="desc'+(val?" show":"")+'">'+(val?('<span class="desc-n">'+val+' \u00b7 '+esc(D.stages[val-1])+'</span> '+esc(D.scale[val-1])):"")+'</p>'
    +'</article>';
  }).join("");
  return '<section class="screen">'
    +'<div class="domain-head">'
      +'<div><p class="eyebrow">Rate each subdomain on the 1\u20136 scale</p><h2 class="screen-title">'+esc(dom.name)+'</h2></div>'
      +'<span class="answered-chip'+(full?" full":"")+'">'+answered+' of '+total+' rated</span>'
    +'</div>'
    +'<details class="scale-ref"><summary>View the 1\u20136 rating scale</summary><div>'+scaleTable()+'</div></details>'
    + items
    + navRow({nextLabel: idx<3 ? "Continue to Domain "+(idx+2) : "See your results", disabled:!full, hint: full?null:"Rate every item to continue"})
  +'</section>';
}
function wireDomain(){
  document.querySelectorAll(".rate").forEach(b=>b.addEventListener("click",()=>{
    state.ratings[b.dataset.key] = +b.dataset.val;
    render();
  }));
}

function faBlock(domKey, expanded){
  const fa = D.focusAction[domKey];
  const focusLabels = {classroom:"Classroom level focus", school:"School site level focus", lea:"LEA level focus"};
  const focusAll = D.levels.map(l=>'<div class="fa-focus"><span class="fl">'+esc(focusLabels[l.key])+'</span><p>'+esc(fa.focus[l.key])+'</p></div>').join("");
  const acts = '<div class="fa-actions">'+fa.actions.map(a=>'<div class="fa-action"><div><div class="at">'+esc(a.a)+'</div><div class="ad">'+esc(a.d)+'</div></div></div>').join("")+'</div>';
  const body = '<div class="fa-body">'
    +'<details class="other-levels" open><summary>Role notes: how the focus differs by audience</summary>'+focusAll+'</details>'
    +'<p class="section-sub" style="margin-bottom:4px">Practices to strengthen this domain</p>'+acts+'</div>';
  if(expanded){
    return '<div class="fa-block"><div class="fa-head"><h3>'+esc(fa.title)+'</h3></div>'+body+'</div>';
  }
  return '<details class="fa-collapsed"><summary>'+esc(fa.title)+' \u2014 reference</summary>'+body+'</details>';
}

function screenResults(){
  const avgs = D.domains.map(d=>({d, avg:domainAvg(d)}));
  const overall = avgs.reduce((a,x)=>a+x.avg,0)/avgs.length;
  const ob = bandFor(overall);
  const domCards = avgs.map(x=>{
    const b = bandFor(x.avg);
    return '<div class="dom-card">'
      +'<div class="dom-card-top"><h3>'+esc(x.d.name)+'</h3>'
      +'<div class="chips"><span class="dom-avg">'+fmt(x.avg)+'</span><span class="band-chip chip-'+b.key+'">'+esc(b.band)+'</span></div></div>'
      +'<p class="meaning">'+esc(b.meaning)+'</p>'
      +'<div class="bar"><span class="fill-'+b.key+'" style="width:'+(x.avg/6*100)+'%"></span></div>'
    +'</div>';
  }).join("");
  const below = avgs.filter(x=>x.avg<4);
  const atOrAbove = avgs.filter(x=>x.avg>=4);
  const faSection =
    '<h2 class="section-h">Focus &amp; action by domain</h2>'
    +'<p class="section-sub">'+esc(D.faIntro)+'</p>'
    + (below.length
        ? below.map(x=>faBlock(x.d.id,true)).join("")
        : '<p class="section-sub">No domain average fell below 4.0. The focus and action guidance for each domain is available below for reference.</p>')
    + atOrAbove.map(x=>faBlock(x.d.id,false)).join("");
  const bandsTable = '<table class="bands"><thead><tr><th>Average Range</th><th>Performance Band</th><th>Meaning</th></tr></thead><tbody>'
    + D.bands.map(b=>'<tr><td>'+esc(b.range)+'</td><td><span class="band-chip chip-'+b.key+'">'+esc(b.band)+'</span></td><td>'+esc(b.meaning)+'</td></tr>').join("")
    +'</tbody></table>';
  return '<section class="screen">'
    +'<div class="ribbon">'
      +'<p class="eyebrow">Assessment Results \u00b7 '+esc(D.resultsLabel)+'</p>'
      +'<div class="overall-row"><span class="overall-num">'+fmt(overall)+'</span><span class="band-chip chip-'+ob.key+'">'+esc(ob.band)+'</span></div>'
      +'<p class="meaning">Overall assessment average \u00b7 '+esc(ob.meaning)+'</p>'
    +'</div>'
    +'<div class="dom-results">'+domCards+'</div>'
    +'<h2 class="section-h">Scoring bands and meanings</h2>'
    +'<div class="card" style="overflow:auto">'+bandsTable+'</div>'
    + faSection
    +'<div class="navrow"><button class="btn btn-ghost" id="backBtn">Back to Domain 4</button><span style="flex:1"></span>'
    +'<button class="btn btn-ghost" id="printBtn">Print / save as PDF</button>'
    +'<button class="btn btn-primary" id="restartBtn">Start a new reflection</button></div>'
  +'</section>';
}
function wireResults(){
  const b=document.getElementById("backBtn"); if(b) b.addEventListener("click",()=>go(state.step-1));
  const p=document.getElementById("printBtn"); if(p) p.addEventListener("click",()=>window.print());
  const r=document.getElementById("restartBtn"); if(r) r.addEventListener("click",()=>{
    if(confirm("Start a new reflection? Current responses will be cleared.")){
      state.step=0; state.level=null; state.ratings={}; state.maxVisited=0; render(); window.scrollTo({top:0});
    }
  });
}

function render(){
  renderThread();
  const app = document.getElementById("app");
  const id = STEPS[state.step].id;
  if(id==="cover"){ app.innerHTML = screenCover(); wireCover(); wireNav(); }
  else if(id==="scale"){ app.innerHTML = screenScale(); wireNav(); }
  else if(id==="results"){ app.innerHTML = screenResults(); wireResults(); }
  else{
    const idx = D.domains.findIndex(d=>d.id===id);
    app.innerHTML = screenDomain(D.domains[idx], idx); wireDomain(); wireNav();
  }
}
render();
</script>
</body>
</html>
